{% extends 'System/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Eliminar Posición</h1>
    <div class="alert alert-danger">
        <p>¿Estás seguro que deseas eliminar la posición "{{ position.position_name }}"?</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar Eliminación</button>
        <a href="{% url 'position_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
