{% extends 'System//base.html' %} {% block content %}
<div class="container mt-4">
  {% if position %}
  <h1>Editar Posición</h1>
  {% else %}
  <h1>Nueva Posición</h1>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="form-group mb-3">
      <label for="{{ form.position_code.id_for_label }}">Código:</label>
      {{ form.position_code }}
    </div>
    <div class="form-group mb-3">
      <label for="{{ form.position_name.id_for_label }}">Nombre:</label>
      {{ form.position_name }}
    </div>
    <button type="submit" class="btn btn-primary">
        <i class="fas fa-save me-1"></i>Guardar</button>
    <a href="{% url 'position_list' %}" class="btn btn-secondary">
      Cancelar</a
    >
  </form>
</div>
{% endblock %}
