{% extends 'System/base.html' %}
{% block title %}Editar Plantilla{% endblock %}
{% block content %}
<div class="container">
    <h2>Editar Plantilla Asignada</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{% url 'user_template_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
